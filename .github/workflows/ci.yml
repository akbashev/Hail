# Builds and tests Hail on Linux, x86-64 and arm64, in Swift 6.4's container, and on macOS with the
# image's Xcode 27 and its Swift, where Apple's on-device model is too.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: test
        timeout-minutes: 30
        run: swift test

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: test
        timeout-minutes: 30
        run: swift test
